services:
  db:
    image: postgres:16
    container_name: applyflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-applyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-applyflow}
      POSTGRES_DB: ${POSTGRES_DB:-applyflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - applyflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-applyflow} -d ${POSTGRES_DB:-applyflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  applyflow_pgdata:
